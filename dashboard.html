<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Abel's | Tus obras</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="screen">
  <div class="topbar">
    <div class="logo-badge">A</div>
    <div class="topbar-info">
      <p class="topbar-obra" id="userName">Cargando...</p>
      <p class="topbar-title">Tus obras</p>
    </div>
    <button class="icon-btn" id="logoutBtn" title="Salir" aria-label="Cerrar sesión" style="width:auto;padding:0 12px;gap:6px;">Salir</button>
  </div>

  <div class="card" id="obrasCard">
    <div class="loading">Cargando obras...</div>
  </div>

  <div style="display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:10px;">
    <span style="font-size:12px;color:var(--text-secondary);"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--danger);margin-right:4px;"></span>urgente pendiente</span>
    <span id="leyendaSinFichar" style="font-size:12px;color:var(--text-secondary);"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#D9A400;margin-right:4px;"></span>sin asistencia hoy</span>
    <span style="font-size:12px;color:var(--text-secondary);"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--success);margin-right:4px;"></span>al día</span>
  </div>
</div>

<script type="module">
  import { requireAuth, logout } from "./js/auth.js";
  import { esAdmin, puedeGestionarFichajes, veTodasLasObras, fechaLocal } from "./js/registro.js";
  import { db } from "./js/firebase-config.js";
  import {
    collection, getDocs, query, where, documentId
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  const obrasCard = document.getElementById("obrasCard");
  const userName = document.getElementById("userName");
  let controlAsistencia = false;

  const hoy = () => fechaLocal();

  async function calcularEstado(obraId) {
    try {
      const [fichajesSnap, urgentesSnap, incidenciasSnap] = await Promise.all([
        getDocs(query(collection(db, "obras", obraId, "fichajes"), where("fecha", "==", hoy()))),
        getDocs(query(collection(db, "obras", obraId, "necesidades"), where("prioridad", "==", "urgente"))),
        getDocs(query(collection(db, "obras", obraId, "incidencias"), where("estado", "==", "abierta")))
      ]);
      const hayUrgentesPendientes = urgentesSnap.docs.some(d => d.data().estado !== "hecho");
      const hayIncidenciasAbiertas = !incidenciasSnap.empty;
      if (hayUrgentesPendientes || hayIncidenciasAbiertas) return "var(--danger)";
      if (fichajesSnap.empty && controlAsistencia) return "#D9A400";
      return "var(--success)";
    } catch {
      return "var(--text-muted)";
    }
  }

  document.getElementById("logoutBtn").addEventListener("click", async () => {
    await logout();
    window.location.href = "index.html";
  });

  requireAuth(async (user, perfil) => {
    userName.textContent = perfil.nombre || user.email;
    controlAsistencia = puedeGestionarFichajes(perfil);
    if (!controlAsistencia) document.getElementById("leyendaSinFichar").remove();

    // Menú según el rol: admin ve todo, oficina gestiona fichajes, encargado solo sus obras
    const menu = document.createElement("div");
    menu.className = "dashboard-menu";
    function boton(texto, destino, principal) {
      const b = document.createElement("button");
      b.className = principal ? "primary" : "secondary";
      b.textContent = texto;
      b.addEventListener("click", () => window.location.href = destino);
      menu.appendChild(b);
    }

    if (puedeGestionarFichajes(perfil)) {
      boton("Registro de asistencia (día vencido)", "registro.html", true);
      boton("Ausencias y sin apuntar", "ausencias.html");
      boton("Vacaciones", "vacaciones.html");
      boton("Calendario de festivos", "festivos.html");
      boton("Horas extra del año", "horas-extra.html");
      boton("Exportar control de asistencia", "exportar.html");
      if (esAdmin(perfil)) boton("Pagos de horas extra", "pagos.html");
    }
    boton("Directorio de empleados", "empleados.html");
    if (puedeGestionarFichajes(perfil)) {
      boton("Jornada y horas extra (ajustes)", "ajustes.html");
    }
    if (esAdmin(perfil)) {
      boton("Gestionar obras", "obras.html");
      boton("Gestionar usuarios", "usuarios.html");
    }
    obrasCard.parentElement.insertBefore(menu, obrasCard);

    try {
      let obras = [];
      const obrasRef = collection(db, "obras");

      if (veTodasLasObras(perfil)) {
        const snap = await getDocs(obrasRef);
        obras = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      } else {
        const asignadas = perfil.obrasAsignadas || [];
        if (asignadas.length > 0) {
          const q = query(obrasRef, where(documentId(), "in", asignadas.slice(0, 10)));
          const snap = await getDocs(q);
          obras = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        }
      }

      if (obras.length === 0) {
        obrasCard.innerHTML = '<div class="placeholder">No tienes obras asignadas todavía.</div>';
        return;
      }

      obrasCard.innerHTML = "";
      for (const obra of obras) {
        const item = document.createElement("div");
        item.className = "obra-item";
        item.innerHTML = `
          <div style="display:flex;align-items:center;gap:10px;">
            <span class="punto-estado" style="width:10px;height:10px;border-radius:50%;background:var(--text-muted);flex-shrink:0;"></span>
            <div>
              <p class="obra-name">${obra.nombre || "Sin nombre"}</p>
              <p class="obra-meta">${obra.direccion || ""}</p>
            </div>
          </div>
          <span style="color:var(--text-muted);">&#8250;</span>
        `;
        item.addEventListener("click", () => {
          sessionStorage.setItem("obraActual", JSON.stringify({ id: obra.id, nombre: obra.nombre }));
          window.location.href = "obra.html";
        });
        obrasCard.appendChild(item);
        calcularEstado(obra.id).then(color => {
          item.querySelector(".punto-estado").style.background = color;
        });
      }
    } catch (err) {
      obrasCard.innerHTML = '<div class="placeholder">Error al cargar las obras.</div>';
      console.error(err);
    }
  });
</script>
</body>
</html>
