<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Abel's | Acceso</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="screen">
  <div class="logo-row">
    <div class="logo-badge">A</div>
    <div>
      <p class="brand-title">ABEL'S</p>
      <p class="brand-sub">Construcciones &amp; Reformas</p>
    </div>
  </div>

  <h1>Acceso encargados</h1>
  <p class="page-sub">Introduce tus datos para fichar y gestionar tu obra.</p>

  <div class="error-msg" id="errorMsg"></div>

  <form id="loginForm">
    <label for="email">Correo</label>
    <input type="email" id="email" autocomplete="username" required>

    <label for="password">Contraseña</label>
    <input type="password" id="password" autocomplete="current-password" required>

    <button type="submit" class="primary" id="loginBtn">Entrar</button>
  </form>
</div>

<script type="module">
  import { login, getPerfil } from "./js/auth.js";
  import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { auth } from "./js/firebase-config.js";

  // si ya hay sesión iniciada, saltar directo al selector de obras
  onAuthStateChanged(auth, (user) => {
    if (user) window.location.href = "dashboard.html";
  });

  const form = document.getElementById("loginForm");
  const errorMsg = document.getElementById("errorMsg");
  const loginBtn = document.getElementById("loginBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorMsg.style.display = "none";
    loginBtn.disabled = true;
    loginBtn.textContent = "Entrando...";

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    try {
      const cred = await login(email, password);
      const perfil = await getPerfil(cred.user.uid);
      if (!perfil) {
        throw new Error("Tu usuario no tiene perfil configurado. Contacta con el administrador.");
      }
      window.location.href = "dashboard.html";
    } catch (err) {
      errorMsg.textContent = "No se ha podido entrar. Revisa el correo y la contraseña.";
      errorMsg.style.display = "block";
      loginBtn.disabled = false;
      loginBtn.textContent = "Entrar";
    }
  });
</script>
</body>
</html>
