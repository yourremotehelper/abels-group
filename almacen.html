<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Abel's | Fichaje almacén</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="screen">
  <div class="topbar">
    <button class="icon-btn" id="backBtn" title="Volver" aria-label="Volver">&#8592;</button>
    <div class="topbar-info">
      <p class="topbar-obra" id="fechaTxt">Hoy</p>
      <p class="topbar-title">Control de asistencia</p>
    </div>
  </div>

  <div class="card" style="padding:12px 16px;">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;">
      <span style="font-size:14px;color:var(--text-secondary);">Han entrado</span>
      <span id="contador" style="font-size:22px;font-weight:700;">0 / 0</span>
    </div>
  </div>

  <input type="text" id="buscador" placeholder="Buscar trabajador..." autocomplete="off">

  <div class="card" id="lista">
    <div class="loading">Cargando trabajadores...</div>
  </div>

  <p style="font-size:12px;color:var(--text-muted);text-align:center;">
    Control interno de la oficina: no sustituye al fichaje oficial de los trabajadores.<br>
    Toca "Entrada" cuando llegue cada trabajador. La salida, las horas extra y los días anteriores se apuntan en "Registro manual y correcciones".
  </p>
</div>

<script type="module">
  import { requireAuth } from "./js/auth.js";
  import { db, auth } from "./js/firebase-config.js";
  import {
    collection, getDocs, query, where, doc, setDoc, deleteDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import {
    fechaLocal, horaLocal, fechaBonita, puedeGestionarFichajes, registrarHistorial, esc, avatar,
    cargarAusenciasDelDia, TIPOS_AUSENCIA
  } from "./js/registro.js";

  const lista = document.getElementById("lista");
  const contador = document.getElementById("contador");
  const buscador = document.getElementById("buscador");
  const fecha = fechaLocal();
  document.getElementById("fechaTxt").textContent = "Hoy, " + fechaBonita(fecha);

  document.getElementById("backBtn").addEventListener("click", () => {
    window.location.href = "dashboard.html";
  });

  let perfil = null;
  let obras = [];
  let empleados = [];
  let vehiculos = [];
  let ausencias = {};         // empleadoId -> ausencia de hoy
  const cocheElegido = {};    // empleadoId -> vehiculoId elegido antes de fichar
  const fichados = {};        // empleadoId -> { obraId, ...datos del fichaje }
  const obraElegida = {};     // empleadoId -> obraId elegida en el desplegable

  function nombreObra(id) {
    const o = obras.find(o => o.id === id);
    return o ? o.nombre : "Sin obra";
  }

  function capturarGPS() {
    return new Promise(resolve => {
      if (!navigator.geolocation) { resolve(null); return; }
      navigator.geolocation.getCurrentPosition(
        pos => resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude }),
        () => resolve(null),
        { timeout: 10000, enableHighAccuracy: true, maximumAge: 60000 }
      );
    });
  }

  async function cargar() {
    const [obrasSnap, empSnap, vehSnap, aus] = await Promise.all([
      getDocs(collection(db, "obras")),
      getDocs(collection(db, "empleados")),
      getDocs(collection(db, "vehiculos")),
      cargarAusenciasDelDia(fecha)
    ]);
    ausencias = aus;
    vehiculos = vehSnap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.nombre || "").localeCompare(b.nombre || ""));
    obras = obrasSnap.docs.map(d => ({ id: d.id, ...d.data() }))
      .sort((a, b) => (a.nombre || "").localeCompare(b.nombre || ""));
    empleados = empSnap.docs.map(d => ({ id: d.id, ...d.data() }))
      .filter(e => e.activo !== false)
      .sort((a, b) => (a.nombre || "").localeCompare(b.nombre || ""));

    // Fichajes de hoy en todas las obras (una consulta por obra)
    const snaps = await Promise.all(obras.map(o =>
      getDocs(query(collection(db, "obras", o.id, "fichajes"), where("fecha", "==", fecha)))
        .then(s => ({ obraId: o.id, snap: s }))
    ));
    snaps.forEach(({ obraId, snap }) => {
      snap.forEach(d => {
        const f = d.data();
        if (f.horaEntrada) fichados[f.empleadoId] = { obraId, docId: d.id, ...f };
      });
    });

    empleados.forEach(e => { obraElegida[e.id] = e.obraAsignada || ""; });
    pintar();
  }

  function opcionesObras(sel) {
    return `<option value="" ${!sel ? "selected" : ""}>Elegir obra...</option>` +
      obras.map(o => `<option value="${o.id}" ${o.id === sel ? "selected" : ""}>${esc(o.nombre)}</option>`).join("");
  }

  function nombreVehiculo(id) {
    const v = vehiculos.find(v => v.id === id);
    return v ? v.nombre + (v.matricula ? " (" + v.matricula + ")" : "") : "";
  }

  // Quién lleva ya cada coche hoy, para avisar si se elige dos veces
  function conductorDe(vehId, salvoEmp) {
    const e = empleados.find(e => e.id !== salvoEmp && fichados[e.id] && fichados[e.id].vehiculoId === vehId);
    return e ? e.nombre : "";
  }

  function selectCoche(empId, sel, clase) {
    if (vehiculos.length === 0) return "";
    const opts = vehiculos.map(v => {
      const otro = conductorDe(v.id, empId);
      return `<option value="${v.id}" ${v.id === sel ? "selected" : ""}>${esc(v.nombre)}${otro ? " · lo lleva " + esc(otro) : ""}</option>`;
    }).join("");
    return `<select class="campo ${clase}" data-emp="${empId}" style="height:36px;font-size:13px;margin:6px 0 0;" aria-label="Coche que conduce">
      <option value="" ${!sel ? "selected" : ""}>No conduce</option>${opts}</select>`;
  }

  function pintar() {
    const esperados = empleados.filter(e => !ausencias[e.id] || fichados[e.id]);
    const total = esperados.length;
    const hechos = esperados.filter(e => fichados[e.id]).length;
    contador.textContent = `${hechos} / ${total}`;

    const texto = buscador.value.trim().toLowerCase();
    const visibles = empleados.filter(e => !texto || (e.nombre || "").toLowerCase().includes(texto));

    if (empleados.length === 0) {
      lista.innerHTML = '<div class="placeholder">No hay trabajadores en el directorio. Añádelos en "Directorio de empleados".</div>';
      return;
    }
    if (visibles.length === 0) {
      lista.innerHTML = '<div class="placeholder">Nadie coincide con la búsqueda.</div>';
      return;
    }

    // Primero los que faltan por entrar, después los que ya han entrado
    const orden = e => fichados[e.id] ? 1 : ausencias[e.id] ? 2 : 0;
    visibles.sort((a, b) => orden(a) - orden(b));

    lista.innerHTML = visibles.map(e => {
      const f = fichados[e.id];
      const a = ausencias[e.id];
      if (!f && a) {
        return `
          <div class="obra-item" style="cursor:default;gap:10px;opacity:0.65;">
            ${avatar(e, 40)}
            <div style="flex:1;min-width:0;">
              <p class="obra-name">${esc(e.nombre)}</p>
              <p class="obra-meta">${esc(TIPOS_AUSENCIA[a.tipo] || "Ausente")}${a.hasta && a.hasta !== fecha ? " hasta el " + fechaBonita(a.hasta) : ""}</p>
            </div>
            <span class="chip">No viene</span>
          </div>`;
      }
      if (f) {
        return `
          <div class="obra-item" style="cursor:default;gap:10px;">
            ${avatar(e, 44)}
            <div style="flex:1;min-width:0;">
              <p class="obra-name">${esc(e.nombre)}</p>
              <p class="obra-meta">${esc(nombreObra(f.obraId))}${f.fichadoPorNombre ? " · fichado por " + esc(f.fichadoPorNombre) : ""}</p>
              ${e.carnet ? selectCoche(e.id, f.vehiculoId || "", "sel-coche-fichado") : ""}
            </div>
            <div style="text-align:right;flex-shrink:0;">
              <span class="chip ok">&#10003; ${esc(f.horaEntrada)}</span>
              <div style="margin-top:6px;"><button class="link-btn btn-deshacer" data-emp="${e.id}">deshacer</button></div>
            </div>
          </div>`;
      }
      return `
        <div class="obra-item" style="cursor:default;gap:10px;align-items:center;">
          ${avatar(e, 52)}
          <div style="flex:1;min-width:0;">
            <p class="obra-name" style="font-size:16px;margin-bottom:6px;">${esc(e.nombre)}</p>
            <select class="campo sel-obra" data-emp="${e.id}" style="height:36px;font-size:13px;margin-bottom:0;">
              ${opcionesObras(obraElegida[e.id])}
            </select>
            ${e.carnet ? selectCoche(e.id, cocheElegido[e.id] || "", "sel-coche") : ""}
          </div>
          <button class="btn-grande btn-entrada" data-emp="${e.id}">Entrada</button>
        </div>`;
    }).join("");

    lista.querySelectorAll(".sel-obra").forEach(sel => {
      sel.addEventListener("change", () => { obraElegida[sel.dataset.emp] = sel.value; });
    });

    lista.querySelectorAll(".sel-coche").forEach(sel => {
      sel.addEventListener("change", () => { cocheElegido[sel.dataset.emp] = sel.value; });
    });

    // Cambiar el coche después de fichar: se guarda al momento
    lista.querySelectorAll(".sel-coche-fichado").forEach(sel => {
      sel.addEventListener("change", async () => {
        const empId = sel.dataset.emp;
        const f = fichados[empId];
        const datosCoche = { vehiculoId: sel.value, vehiculoNombre: nombreVehiculo(sel.value) };
        try {
          await setDoc(doc(db, "obras", f.obraId, "fichajes", f.docId), datosCoche, { merge: true });
          Object.assign(f, datosCoche);
          pintar();
        } catch (err) {
          console.error(err);
          alert("No se ha podido guardar el coche. Inténtalo otra vez.");
        }
      });
    });

    lista.querySelectorAll(".btn-entrada").forEach(btn => {
      btn.addEventListener("click", () => ficharEntrada(btn));
    });

    lista.querySelectorAll(".btn-deshacer").forEach(btn => {
      btn.addEventListener("click", () => deshacer(btn.dataset.emp));
    });
  }

  async function ficharEntrada(btn) {
    const empId = btn.dataset.emp;
    const emp = empleados.find(e => e.id === empId);
    const obraId = obraElegida[empId];
    if (!obraId) {
      alert(`Elige primero a qué obra va ${emp.nombre}.`);
      return;
    }
    btn.disabled = true;
    btn.textContent = "...";

    const hora = horaLocal();
    const docId = `${fecha}_${empId}`;
    const datos = {
      empleadoId: empId,
      empleadoNombre: emp.nombre,
      fecha,
      horaEntrada: hora,
      gpsEntrada: null,
      vehiculoId: emp.carnet ? (cocheElegido[empId] || "") : "",
      vehiculoNombre: emp.carnet ? nombreVehiculo(cocheElegido[empId]) : "",
      origen: "almacén",
      fichadoPorUid: auth.currentUser ? auth.currentUser.uid : "",
      fichadoPorNombre: perfil.nombre || "",
      registradoEn: serverTimestamp()
    };

    try {
      // Se guarda al momento (funciona también sin cobertura y se sincroniza después)
      setDoc(doc(db, "obras", obraId, "fichajes", docId), datos, { merge: true })
        .catch(err => console.error(err));
      fichados[empId] = { obraId, docId, ...datos };
      pintar();

      // La ubicación se añade después, sin hacer esperar a nadie
      capturarGPS().then(gps => {
        if (gps) setDoc(doc(db, "obras", obraId, "fichajes", docId), { gpsEntrada: gps }, { merge: true }).catch(() => {});
      });
    } catch (err) {
      console.error(err);
      alert("No se ha podido guardar la entrada. Inténtalo otra vez.");
      btn.disabled = false;
      btn.textContent = "Entrada";
    }
  }

  async function deshacer(empId) {
    const f = fichados[empId];
    const emp = empleados.find(e => e.id === empId);
    if (!f) return;
    if (!confirm(`¿Deshacer la entrada de ${emp.nombre} (${f.horaEntrada})? Quedará anotado en el historial.`)) return;
    try {
      await deleteDoc(doc(db, "obras", f.obraId, "fichajes", f.docId));
      await registrarHistorial({
        accion: "borrado",
        obraId: f.obraId,
        empleadoId: empId,
        empleadoNombre: emp.nombre,
        fecha,
        antes: { ...f },
        despues: null,
        motivo: "Entrada deshecha desde el almacén",
        perfil
      });
      delete fichados[empId];
      pintar();
    } catch (err) {
      console.error(err);
      alert("No se ha podido deshacer. Inténtalo otra vez.");
    }
  }

  buscador.addEventListener("input", pintar);

  requireAuth(async (user, p) => {
    if (!puedeGestionarFichajes(p)) {
      alert("Esta pantalla es solo para oficina y administración.");
      window.location.href = "dashboard.html";
      return;
    }
    perfil = p;
    try {
      await cargar();
    } catch (err) {
      console.error(err);
      lista.innerHTML = '<div class="placeholder">Error al cargar. Revisa la conexión y vuelve a entrar.</div>';
    }
  });
</script>
<script type="module" src="js/actualizacion.js"></script>
</body>
</html>
